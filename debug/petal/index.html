<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Petal — Fleur</title>
<style>
  html,body{height:100%;margin:0;overflow:hidden;background:
    radial-gradient(58% 64% at 51% 38%,rgba(120,78,255,.16),transparent 62%),
    radial-gradient(75% 85% at 50% 45%,#1a1530 0,#0c0d14 56%,#07080d 100%)}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="/lib/three.min.js"></script>
<script>
(async () => {
  'use strict';
  const N = 120, M = 28;
  const AXIS_ANG = Math.atan2(400, 255);
  const ax = [Math.cos(AXIS_ANG), Math.sin(AXIS_ANG)];
  const FLOW = { radius: 300, scale: 140, drag: 160, amp: 82 };
  const WIND = { amp: 46, period: 3.4 };
  const GLSL_FLOW = `#define R0 ${FLOW.radius.toFixed(1)}\n#define FLOW_SCALE ${FLOW.scale.toFixed(1)}\n#define DRAG ${FLOW.drag.toFixed(1)}\n#define WIND_AMP ${WIND.amp.toFixed(1)}\n#define WIND_PERIOD ${WIND.period.toFixed(1)}\n`;
  const Q = [[40, 370], [160, 510], [310, 270], [470, 430]];
  const bez = (p0, p1, p2, p3, t) => {
    const m = 1 - t;
    return m * m * m * p0 + 3 * m * m * t * p1 + 3 * m * t * t * p2 + t * t * t * p3;
  };

  // ---- shaders: dùng đúng file của trang chính ----
  const all = await (await fetch('/shaders.glsl')).text();
  const re = /^[ \t]*\/\/[ \t]*-+[ \t]*(\w+)/gm;
  const marks = []; let m;
  while ((m = re.exec(all)) !== null) marks.push({ key: m[1], start: all.indexOf('\n', m.index) + 1 });
  const shaders = {};
  for (let i = 0; i < marks.length; i++) {
    const { key, start } = marks[i];
    if (key in shaders) continue;
    shaders[key] = all.slice(start, i + 1 < marks.length ? marks[i + 1].start : undefined).trim();
  }
  shaders.VERT = GLSL_FLOW + shaders.VERT;

  // ---- three ----
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 1, 8000);
  const group = new THREE.Group();
  group.rotation.z = Math.PI / 2 - AXIS_ANG;       // trục cánh hướng thẳng lên
  scene.add(group);

  // ---- dựng đúng một cánh (cùng dáng với main.js) ----
  const V = N * M;
  const pos = new Float32Array(V * 3);
  let lmax = 0;
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1), s = 2 * t - 1;
    const Ax = bez(Q[0][0], Q[1][0], Q[2][0], Q[3][0], t);
    const Ay = bez(Q[0][1], Q[1][1], Q[2][1], Q[3][1], t);
    const len = Math.hypot(Ax, Ay) || 1, nx = Ay / len, ny = -Ax / len;
    const stx = nx * s * 6, sty = ny * s * 6;
    const c1x = 0.30 * Ax + nx * s * 63, c1y = 0.30 * Ay + ny * s * 63;
    const c2x = 0.72 * Ax + nx * s * 49, c2y = 0.72 * Ay + ny * s * 49;
    for (let j = 0; j < M; j++) {
      const u = j / (M - 1), o = (i * M + j) * 3;
      pos[o] = bez(stx, c1x, c2x, Ax, u);
      pos[o + 1] = bez(sty, c1y, c2y, Ay, u);
      pos[o + 2] = t;
    }
  }
  const aPetal = new Float32Array(V * 2), aBake = new Float32Array(V * 3);
  for (let k = 0; k < V; k++) lmax = Math.max(lmax, pos[k * 3] * ax[0] + pos[k * 3 + 1] * ax[1]);
  for (let k = 0; k < V; k++) {
    const x = pos[k * 3], y = pos[k * 3 + 1];
    const u = Math.max(0, Math.min(1.1, (x * ax[0] + y * ax[1]) / lmax));
    aPetal[k * 2] = u; aPetal[k * 2 + 1] = Math.pow(u, 1.25);
    const rho = Math.min(1.2, Math.hypot(x, y) / FLOW.radius);
    aBake[k * 3] = rho; aBake[k * 3 + 1] = Math.pow(rho, 1.6); aBake[k * 3 + 2] = Math.pow(rho, 1.4);
  }
  const posAttr = new THREE.BufferAttribute(pos, 3);
  const aPetalAttr = new THREE.BufferAttribute(aPetal, 2);
  const aBakeAttr = new THREE.BufferAttribute(aBake, 3);

  const lineIdx = [], rimIdx = [], fillIdx = [];
  for (let i = 0; i < N; i++) for (let j = 0; j < M - 1; j++) lineIdx.push(i * M + j, i * M + j + 1);
  for (let i = 0; i < N - 1; i++) {
    rimIdx.push(i * M + M - 1, (i + 1) * M + M - 1);
    for (let j = 0; j < M - 1; j++) {
      const a = i * M + j, b = a + 1, c = a + M, d = c + 1;
      fillIdx.push(a, b, c, b, d, c);
    }
  }

  // ---- uniforms ----
  const col = (h) => new THREE.Color(h);
  const ramp = ['#ff3d5a', '#c02ad0', '#8e56ea', '#c0adf4', '#b9c3ff'];
  const lightA = 43 * Math.PI / 180;
  const U = {
    uOpen: { value: 1 }, uAmp: { value: FLOW.amp }, uEnergy: { value: 0.22 },
    uPhase: { value: 0 }, uDrift: { value: 0 }, uTime: { value: 0 }, uWind: { value: 1 },
    uLmax: { value: lmax }, uAxis: { value: new THREE.Vector2(ax[0], ax[1]) },
    uGdir: { value: new THREE.Vector2(320, 410).normalize() },
    uLight: { value: new THREE.Vector2(Math.cos(lightA), Math.sin(lightA)) },
    uLightK: { value: new THREE.Vector3(0.25, 0.18, 0.2) },
    uC0: { value: col(ramp[0]) }, uC1: { value: col(ramp[1]) }, uC2: { value: col(ramp[2]) },
    uC3: { value: col(ramp[3]) }, uC4: { value: col(ramp[4]) }, uDeep: { value: col('#5a35c8') },
  };

  // ---- một instance: cánh mở hoàn toàn, hướng 0 ----
  const iData = new THREE.InstancedBufferAttribute(new Float32Array([0, 1, 1, 0.37]), 4);
  const iData2 = new THREE.InstancedBufferAttribute(new Float32Array([Math.PI / 2, 0, 1]), 3);
  const iRot = new THREE.InstancedBufferAttribute(new Float32Array([1, 0, 1, 1]), 4);

  const makeGeo = (idx) => {
    const g = new THREE.InstancedBufferGeometry();
    g.setAttribute('position', posAttr);
    g.setAttribute('aPetal', aPetalAttr);
    g.setAttribute('aBake', aBakeAttr);
    g.setAttribute('iData', iData);
    g.setAttribute('iData2', iData2);
    g.setAttribute('iRot', iRot);
    g.setIndex(idx);
    g.instanceCount = 1;
    return g;
  };
  const mat = (alpha) => new THREE.ShaderMaterial({
    uniforms: Object.assign({ uAlpha: { value: alpha } }, U),
    vertexShader: shaders.VERT, fragmentShader: shaders.FRAG,
    transparent: true, depthWrite: false, depthTest: false,
  });
  [[new THREE.Mesh(makeGeo(fillIdx), mat(0.12)), 1],
   [new THREE.LineSegments(makeGeo(lineIdx), mat(0.38)), 2],
   [new THREE.LineSegments(makeGeo(rimIdx), mat(0.92)), 3]]
    .forEach(([o, order]) => {
      o.frustumCulled = false; o.renderOrder = order; group.add(o);
    });

  // ---- camera fit + resize ----
  const fit = () => {
    const w = innerWidth, h = innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    const half = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
    camera.position.set(0, 300, Math.max(1120, 330 / (half * Math.max(0.2, camera.aspect))));
    camera.lookAt(0, 300, 0);
    camera.updateProjectionMatrix();
  };
  fit();
  addEventListener('resize', fit);

  // ---- wind nhẹ, chỉ một cánh ----
  const clock = new THREE.Clock();
  let phase = 0;
  renderer.setAnimationLoop(() => {
    phase += Math.min(clock.getDelta(), 0.05) * 0.85;
    U.uTime.value = phase;
    U.uPhase.value = phase;
    renderer.render(scene, camera);
  });
})();
</script>
</body>
</html>
